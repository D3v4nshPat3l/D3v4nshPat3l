name: Refresh Profile Telemetry

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/gen_stats.py"
      - "scripts/gen_ascii_portrait.py"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-telemetry
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install imaging deps
        run: python -m pip install --quiet pillow numpy

      - name: Render telemetry cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_USER: ${{ github.repository_owner }}
        run: python scripts/gen_stats.py

      - name: Render ASCII portrait
        env:
          STATS_USER: ${{ github.repository_owner }}
        run: python scripts/gen_ascii_portrait.py

      - name: Commit if changed
        env:
          CARDS: assets/stats.svg assets/contributions.svg assets/ascii-portrait.svg
        run: |
          if [ -z "$(git status --porcelain -- $CARDS)" ]; then
            echo "telemetry cards unchanged - nothing to commit"
            exit 0
          fi
          git config user.name  "D3v4nshPat3l"
          git config user.email "147400702+D3v4nshPat3l@users.noreply.github.com"
          git add -- $CARDS
          git commit -m "chore: refresh profile telemetry"
          git push
