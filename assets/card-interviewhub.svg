<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 250" width="580" height="250" role="img" aria-label="Interview Hub - 5000+ curated cybersecurity interview questions with answers">
<title>Interview Hub</title>
<defs>
  <linearGradient id="ih-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0916"/><stop offset="1" stop-color="#05040b"/>
  </linearGradient>
  <radialGradient id="ih-glow" cx="80%" cy="50%" r="55%">
    <stop offset="0" stop-color="#a78bfa" stop-opacity="0.14"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <pattern id="ih-grid" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M26 0 V26 M0 26 H26" stroke="#130f22" stroke-width="1" fill="none"/>
  </pattern>
  <style>
    .m{font-family:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace}
    .d{font-size:11px;fill:#948aa8}
    .chip{font-size:9px;letter-spacing:1.1px;fill:#cbbcf9}
    .qt{font-size:9px;fill:#b9a9e8}
    .tag{font-size:8.5px;letter-spacing:1.6px;fill:#a78bfa;font-weight:700}
  </style>
</defs>

<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#ih-bg)" stroke="#2a2247"/>
<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#ih-grid)" opacity="0.6"/>
<rect x="1" y="1" width="578" height="248" rx="12" fill="url(#ih-glow)"/>
<rect x="1" y="1" width="5" height="248" rx="2.5" fill="#a78bfa" opacity="0.75"/>

<g class="m">
  <rect x="24" y="20" width="34" height="18" rx="4" fill="#1a1233" stroke="#4c3d80"/>
  <text x="41" y="33" font-size="10" font-weight="700" fill="#a78bfa" text-anchor="middle">05</text>
  <circle cx="72" cy="29" r="3.5" fill="#a78bfa"><animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/></circle>
  <text x="84" y="33" font-size="9.5" letter-spacing="1.8" fill="#6d5fa0">KNOWLEDGE BASE &#183; PREP</text>

  <text x="24" y="72" font-size="26" font-weight="700" letter-spacing="1.4" fill="#f3eeff">INTERVIEW HUB</text>
  <text x="24" y="93" font-size="10" letter-spacing="2.3" fill="#a78bfa">5,000+ SECURITY Q&#38;A &#183; ALL DOMAINS</text>
  <path d="M24 104 H352" stroke="#2a2247"/>

  <text class="d" x="24" y="124">5,000+ curated cybersecurity interview questions</text>
  <text class="d" x="24" y="141">with answers across network and web security,</text>
  <text class="d" x="24" y="158">cloud, forensics, blue team, GRC and incident</text>
  <text class="d" x="24" y="175">response &#8212; structured for real interview prep.</text>

  <g>
    <rect x="24" y="196" width="58" height="17" rx="3.5" fill="#1a1233" stroke="#3d3168"/><text class="chip" x="53" y="208" text-anchor="middle">NETWORK</text>
    <rect x="88" y="196" width="46" height="17" rx="3.5" fill="#1a1233" stroke="#3d3168"/><text class="chip" x="111" y="208" text-anchor="middle">WEB</text>
    <rect x="140" y="196" width="52" height="17" rx="3.5" fill="#1a1233" stroke="#3d3168"/><text class="chip" x="166" y="208" text-anchor="middle">CLOUD</text>
    <rect x="198" y="196" width="70" height="17" rx="3.5" fill="#1a1233" stroke="#3d3168"/><text class="chip" x="233" y="208" text-anchor="middle">BLUE TEAM</text>
    <rect x="274" y="196" width="40" height="17" rx="3.5" fill="#1a1233" stroke="#3d3168"/><text class="chip" x="294" y="208" text-anchor="middle">GRC</text>
  </g>

  <text x="556" y="234" font-size="9.5" letter-spacing="1.6" fill="#544784" text-anchor="end">github.com/D3v4nshPat3l/Interview-Hub</text>
</g>

<!-- question card stack -->
<g>
  <rect x="398" y="46" width="152" height="98" rx="7" fill="#0d0a1c" stroke="#241d3e"/>
  <rect x="392" y="52" width="152" height="98" rx="7" fill="#100c22" stroke="#2c2450"/>
  <rect x="386" y="58" width="152" height="98" rx="7" fill="#150f2c" stroke="#4c3d80"/>

  <g class="m">
    <g opacity="0">
      <text class="tag" x="398" y="78">WEB SECURITY</text>
      <text class="qt" x="398" y="99">Explain SSRF impact and</text>
      <text class="qt" x="398" y="113">how you would validate it.</text>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.22;0.245;1" dur="14s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <text class="tag" x="398" y="78">NETWORK</text>
      <text class="qt" x="398" y="99">How does TLS 1.3 differ</text>
      <text class="qt" x="398" y="113">from 1.2 in the handshake?</text>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.47;0.495;1" dur="14s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <text class="tag" x="398" y="78">BLUE TEAM</text>
      <text class="qt" x="398" y="99">Walk through triaging a</text>
      <text class="qt" x="398" y="113">suspicious PowerShell log.</text>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.72;0.745;1" dur="14s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <text class="tag" x="398" y="78">CLOUD &#38; GRC</text>
      <text class="qt" x="398" y="99">What is least privilege in</text>
      <text class="qt" x="398" y="113">an IAM policy review?</text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.98;1" dur="14s" repeatCount="indefinite"/>
    </g>

    <path d="M398 128 H526" stroke="#2c2450"/>
    <text x="398" y="143" font-size="8.5" letter-spacing="1.4" fill="#6d5fa0">ANSWER</text>
    <rect x="452" y="136" width="74" height="7" rx="3.5" fill="#241d3e"/>
    <rect x="452" y="136" width="10" height="7" rx="3.5" fill="#a78bfa">
      <animate attributeName="width" values="0;74;74;0" keyTimes="0;0.55;0.9;1" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g class="m">
    <text x="386" y="192" font-size="21" font-weight="700" fill="#a78bfa">5,000+</text>
    <text x="472" y="182" font-size="8.5" letter-spacing="1.6" fill="#6d5fa0">CURATED</text>
    <text x="472" y="194" font-size="8.5" letter-spacing="1.6" fill="#6d5fa0">QUESTIONS</text>
    <circle cx="546" cy="187" r="3.5" fill="#a78bfa"><animate attributeName="opacity" values="1;0.15;1" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>
</g>
</svg>
